# Home Sanctuary - Nginx Configuration
# Place in: /etc/nginx/sites-available/home-sanctuary

server {
    listen 80;
    listen [::]:80;
    
    # Change to your domain when ready, or use _ for any hostname
    server_name sanctuary.local _;
    
    root /opt/home-sanctuary/web;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/home-sanctuary.access.log;
    error_log /var/log/nginx/home-sanctuary.error.log;
}
